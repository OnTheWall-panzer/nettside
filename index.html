    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #333333;
            color: white;
            transition: background-color 0.5s ease;
        }
        .large-text {
            font-size: 6em;
            font-weight: normal;
        }
        a {
            font-size: 6px;
            color: #383838;
            text-decoration: none;
            position: relative;
            margin-top: 10px;
        }
        img {
            transition: transform 0.3s ease, filter 0.3s ease;
            max-width: 100%;
            height: auto;
        }
        img:hover {
            transform: scale(1.05) rotate(1deg);
            filter: brightness(1.2);
        }
        .header-scroll {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #ff00ff;
            color: black;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            overflow: hidden;
            white-space: nowrap;
            animation: scroll-text 10s linear infinite;
            z-index: 1000;
        }
        @keyframes scroll-text {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
        .btn-chaos {
            padding: 10px 20px;
            font-size: 1.2em;
            margin: 20px;
            cursor: pointer;
            background-color: #ff00ff;
            color: black;
            border: none;
            border-radius: 5px;
        }
        .meme-container {
            margin: 20px 0;
        }
        .tooltip {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }
        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #555;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%; /* Position above the text */
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
